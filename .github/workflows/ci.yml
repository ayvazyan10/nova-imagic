name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-and-syntax:
    name: Composer metadata and PHP 8.1 syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  frontend-dependencies:
    name: Frontend dependency lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

  licensed-suite:
    name: ${{ matrix.label }} licensed suite
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: EOL compatibility - PHP 8.1 / Laravel 9 / Nova 4 / Image 2
            php: "8.1"
            nova: ^4.0
            intervention: ^2.7
            testbench: ^7.0
            legacy: true
            build_assets: true
            verify_dist: false
          - label: EOL compatibility - PHP 8.2 / Laravel 10 / Nova 4 / Image 3
            php: "8.2"
            nova: ^4.0
            intervention: ^3.11
            testbench: ^8.0
            legacy: true
            build_assets: false
            verify_dist: false
          - label: EOL compatibility - PHP 8.3 / Laravel 11 / Nova 5 / Image 3
            php: "8.3"
            nova: ^5.0
            intervention: ^3.11
            testbench: ^9.0
            legacy: true
            build_assets: true
            verify_dist: false
          - label: PHP 8.4 / Laravel 12 / Nova 5 / Image 3
            php: "8.4"
            nova: ^5.0
            intervention: ^3.11
            testbench: ^10.0
            legacy: false
            build_assets: true
            verify_dist: true

    defaults:
      run:
        working-directory: nova-components/Imagic

    steps:
      - name: Check out repository in a Nova component layout
        uses: actions/checkout@v7
        with:
          path: nova-components/Imagic

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, sqlite3
          coverage: none
          tools: composer:v2

      - name: Detect Nova credentials
        id: nova-auth
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          if [[ -n "$NOVA_USERNAME" && -n "$NOVA_LICENSE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Licensed tests were skipped. Configure NOVA_USERNAME and NOVA_LICENSE_KEY repository secrets to enable them."
            echo "### Licensed matrix skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure the NOVA_USERNAME and NOVA_LICENSE_KEY repository secrets to run this job." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::Release tags require the licensed Nova matrix."
              exit 1
            fi
          fi

      - name: Configure Nova authentication and component vendor directory
        if: steps.nova-auth.outputs.enabled == 'true'
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"
          composer config repositories.nova composer https://nova.laravel.com
          composer config vendor-dir ../../vendor

      - name: Install EOL compatibility dependencies
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.legacy == true
        env:
          # Scoped to this ephemeral compatibility install. Production users
          # must upgrade instead of disabling Composer advisory blocking.
          COMPOSER_POLICY_ADVISORIES_BLOCK: "0"
        run: >-
          composer update
          --with "laravel/nova:${{ matrix.nova }}"
          --with "intervention/image:${{ matrix.intervention }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --prefer-dist
          --no-interaction
          --no-progress

      - name: Install current dependencies with security blocking
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.legacy == false
        run: >-
          composer update
          --with "laravel/nova:${{ matrix.nova }}"
          --with "intervention/image:${{ matrix.intervention }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --prefer-dist
          --no-interaction
          --no-progress

      - name: Report EOL compatibility dependency advisories
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.legacy == true
        continue-on-error: true
        run: |
          echo "::warning::This EOL compatibility row installs an unsupported Laravel line only to detect Imagic regressions. Its audit findings are expected and do not represent secure production support."
          echo "### EOL compatibility dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "This row exercises source compatibility only. Laravel is EOL and active advisories remain visible below." >> "$GITHUB_STEP_SUMMARY"
          composer audit --locked

      - name: Audit current dependencies
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.legacy == false
        run: composer audit --locked

      - name: Run PHP tests
        if: steps.nova-auth.outputs.enabled == 'true'
        run: composer test

      - name: Set up Node.js
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.build_assets
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nova-components/Imagic/package-lock.json

      - name: Build production assets
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.build_assets
        run: |
          npm ci
          npm run nova:install
          npm run production

      - name: Verify committed assets
        if: steps.nova-auth.outputs.enabled == 'true' && matrix.verify_dist
        run: git diff --exit-code -- dist
